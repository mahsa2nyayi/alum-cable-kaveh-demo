name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        # Make this step blocking once the legacy code base is lint-clean.
        continue-on-error: true
        run: npm run lint
      - name: Check that migrations match schema.prisma (no drift)
        # Informational: fails when someone edits schema.prisma without a migration.
        continue-on-error: true
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci -c 'CREATE DATABASE shadow'
          npx prisma migrate diff --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://ci:ci@localhost:5432/shadow" --exit-code
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Build
        run: npm run build
      - name: Dependency audit (production deps)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
